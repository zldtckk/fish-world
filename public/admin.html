<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机构后台 - 大家一起来画鱼</title>
  <link rel="stylesheet" href="/styles.css?v=2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
  <style>
    .admin-page { max-width: 800px; margin: 0 auto; padding: 24px 0; }
    .admin-login {
      max-width: 360px;
      margin: 60px auto;
      padding: 32px;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid rgba(74,184,232,0.1);
      box-shadow: var(--shadow);
    }
    .admin-login h2 { text-align: center; margin-bottom: 20px; }
    .admin-login .form-group { margin-bottom: 16px; }
    .admin-login .form-group label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 4px; }
    .admin-login .form-group input {
      width: 100%; padding: 10px 14px;
      border-radius: 8px; border: 1px solid rgba(74,184,232,0.15);
      font-size: 14px; font-family: inherit; outline: none; box-sizing: border-box;
    }
    .admin-login .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74,184,232,0.1); }
    .edit-input {
      width: 100%; padding: 10px 14px; border-radius: 8px;
      border: 1px solid rgba(74,184,232,0.15); font-size: 14px;
      font-family: inherit; outline: none; background: var(--bg); color: var(--text);
      box-sizing: border-box;
    }
    .edit-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(74,184,232,0.1); }
    .admin-login .login-btn {
      width: 100%; padding: 12px;
      border-radius: 10px; border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-size: 16px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .admin-login .login-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(74,184,232,0.35); }
    .admin-error { color: var(--danger); font-size: 13px; text-align: center; margin-top: 8px; }

    /* Dashboard */
    .dashboard { display: none; }
    .dashboard-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap; gap: 8px;
    }
    .dashboard-header h2 { font-size: 22px; }
    .dashboard-header .inst-name { color: var(--accent-dark); }
    .logout-btn {
      padding: 8px 16px; border-radius: 20px;
      border: 1px solid rgba(74,184,232,0.15);
      background: transparent; color: var(--text2);
      font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* Stats cards */
    .stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface);
      border-radius: 12px; padding: 16px;
      text-align: center;
      border: 1px solid rgba(74,184,232,0.08);
    }
    .stat-card .num { font-size: 24px; font-weight: 700; color: var(--accent-dark); }
    .stat-card .lbl { font-size: 12px; color: var(--text2); margin-top: 2px; }
    @media (max-width: 600px) { .stat-cards { grid-template-columns: repeat(2, 1fr); } }

    /* Section */
    .admin-section { margin-bottom: 24px; }
    .admin-section h3 { font-size: 16px; margin-bottom: 12px; color: var(--text); }

    /* Table */
    .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .admin-table th {
      text-align: left; padding: 8px 10px;
      border-bottom: 2px solid rgba(74,184,232,0.1);
      color: var(--text2); font-weight: 500;
    }
    .admin-table td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(74,184,232,0.06);
      color: var(--text);
    }
    .admin-table tr:hover td { background: rgba(74,184,232,0.03); }
    .admin-table-wrap { overflow-x: auto; }

    .has-phone { color: var(--success); font-weight: 600; }
    .no-phone { color: var(--text3); }

    /* New activity form */
    .new-activity-form {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .new-activity-form input {
      flex: 1; min-width: 150px;
      padding: 8px 12px; border-radius: 8px;
      border: 1px solid rgba(74,184,232,0.15); font-size: 13px;
      font-family: inherit; outline: none;
    }
    .new-activity-form input:focus { border-color: var(--accent); }
    .new-activity-form button {
      padding: 8px 16px; border-radius: 8px; border: none;
      background: var(--accent); color: #fff;
      font-size: 13px; cursor: pointer; font-family: inherit;
      white-space: nowrap;
    }

    .activity-code { color: var(--accent); font-family: monospace; font-size: 12px; }
    .copy-link-btn {
      padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(74,184,232,0.2);
      background: transparent; color: var(--accent-dark); font-size: 12px;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .copy-link-btn:hover { background: rgba(74,184,232,0.08); }

    .form-tab {
      flex: 1; padding: 8px 16px; border-radius: 8px;
      border: 1px solid rgba(74,184,232,0.15);
      background: transparent; color: var(--text2);
      font-size: 14px; font-family: inherit; cursor: pointer;
    }
    .form-tab.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }

    .fish-preview-img { max-width: 60px; max-height: 40px; border-radius: 4px; vertical-align: middle; }
    .edit-btn {
      padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(74,184,232,0.2);
      background: transparent; color: var(--accent-dark); font-size: 12px;
      cursor: pointer; font-family: inherit;
    }
    .edit-btn:hover { background: rgba(74,184,232,0.08); }
  </style>
</head>
<body>
  <div class="ocean-bg"></div>
  <header>
    <div class="container" style="display:flex;align-items:center;justify-content:space-between;width:100%">
      <a href="/" class="logo">🐟 大家一起来画鱼</a>
      <nav>
        <a href="/" class="nav-btn">水族箱</a>
        <a href="/admin.html" class="nav-btn active">🏫 机构后台</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Login / Register -->
    <div id="loginForm" class="admin-login">
      <div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px">
        <button id="tabLogin" class="form-tab active" onclick="showLogin()">登录</button>
        <button id="tabRegister" class="form-tab" onclick="showRegister()">注册</button>
        <button id="tabSuper" class="form-tab" onclick="showSuperLogin()">👑 超级管理员</button>
      </div>

      <!-- Login form -->
      <div id="loginPanel">
        <h2>🏫 机构登录</h2>
        <div class="form-group">
          <label>手机号</label>
          <input type="tel" id="loginPhone" placeholder="输入手机号" maxlength="11">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="输入密码" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <button class="login-btn" onclick="doLogin()">登录</button>
      </div>

      <!-- Register form -->
      <div id="registerPanel" style="display:none">
        <h2>🏫 机构注册</h2>
        <div class="form-group">
          <label>机构名称</label>
          <input type="text" id="regName" placeholder="如：番茄田美术">
        </div>
        <div class="form-group">
          <label>手机号</label>
          <input type="tel" id="regPhone" placeholder="输入手机号" maxlength="11">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="regPassword" placeholder="至少6位" onkeydown="if(event.key==='Enter')doRegister()">
        </div>
        <button class="login-btn" onclick="doRegister()">注册</button>
      </div>

      <!-- Super admin login form -->
      <div id="superPanel" style="display:none">
        <h2>👑 超级管理员</h2>
        <div class="form-group">
          <label>账号</label>
          <input type="text" id="superUser" placeholder="管理员账号">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="superPassword" placeholder="密码" onkeydown="if(event.key==='Enter')doSuperLogin()">
        </div>
        <button class="login-btn" onclick="doSuperLogin()">登录</button>
      </div>

      <div class="admin-error" id="loginError"></div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="admin-page dashboard">
      <div class="dashboard-header">
        <h2>📊 <span class="inst-name" id="instName"></span></h2>
        <button class="logout-btn" onclick="doLogout()">退出登录</button>
      </div>

      <div class="stat-cards" id="statCards"></div>

      <div class="admin-section">
        <h3>📋 活动管理</h3>
        <div class="new-activity-form">
          <input type="text" id="newActivityName" placeholder="新活动名称，如：万达广场站">
          <button onclick="createActivity()">+ 创建活动</button>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table" id="activityTable">
            <thead><tr><th>活动名称</th><th>活动码</th><th>作品</th><th>总赞</th><th>创建时间</th><th>操作</th></tr></thead>
            <tbody id="activityBody"></tbody>
          </table>
        </div>
      </div>

      <div class="admin-section">
        <h3>📋 作品列表</h3>
        <div class="admin-table-wrap">
          <table class="admin-table" id="fishTable">
            <thead><tr><th>鱼名</th><th>孩子</th><th>年龄</th><th>⭐ 赞</th><th>📱 留资</th><th>时间</th></tr></thead>
            <tbody id="fishBody"></tbody>
          </table>
        </div>
      </div>

      <div class="admin-section">
        <h3>📱 家长留资</h3>
        <div class="admin-table-wrap">
          <table class="admin-table" id="leadTable">
            <thead><tr><th>手机号</th><th>孩子</th><th>年龄</th><th>鱼名</th><th>时间</th></tr></thead>
            <tbody id="leadBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Super Admin Dashboard -->
    <div id="superDashboard" class="admin-page dashboard">
      <div class="dashboard-header">
        <h2>👑 超级管理员</h2>
        <button class="logout-btn" onclick="doLogout()">退出登录</button>
      </div>
      <div class="stat-cards" id="superStatCards"></div>
      <div class="admin-section">
        <h3>🏫 机构列表</h3>
        <div class="admin-table-wrap">
          <table class="admin-table" id="superInstTable">
            <thead><tr><th>机构名称</th><th>手机号</th><th>作品数</th><th>留资数</th><th>总赞</th><th>注册时间</th></tr></thead>
            <tbody id="superInstBody"></tbody>
          </table>
        </div>
      </div>
      <div class="admin-section">
        <h3>📱 全部留资</h3>
        <div class="admin-table-wrap">
          <table class="admin-table" id="superLeadTable">
            <thead><tr><th>手机号</th><th>孩子</th><th>年龄</th><th>鱼名</th><th>机构</th><th>时间</th></tr></thead>
            <tbody id="superLeadBody"></tbody>
          </table>
        </div>
      </div>
      <div class="admin-section">
        <h3>🐟 全部作品管理</h3>
        <div style="margin-bottom:10px;display:flex;gap:8px;align-items:center">
          <button class="login-btn" style="padding:6px 16px;font-size:13px" onclick="superDeleteFish()">🗑️ 删除选中</button>
          <button class="login-btn" style="padding:6px 16px;font-size:13px" onclick="superEditFish()">✏️ 编辑选中</button>
          <span id="superFishCount" style="font-size:13px;color:var(--text2);margin-left:8px"></span>
        </div>
        <div class="admin-table-wrap" style="max-height:500px;overflow-y:auto;border:1px solid rgba(74,184,232,0.1);border-radius:8px">
          <table class="admin-table" id="superFishTable">
            <thead><tr>
              <th style="width:36px"><input type="checkbox" id="superFishAll" onchange="superToggleAllFish(this.checked)"></th>
              <th>预览</th><th>鱼名</th><th>孩子</th><th>年龄</th><th>手机</th><th>机构</th><th>赞</th><th>状态</th><th>时间</th>
            </tr></thead>
            <tbody id="superFishBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    let token = localStorage.getItem('adminToken');

    window.addEventListener('load', () => {
      if (token) {
        if (localStorage.getItem('isSuperAdmin')) {
          loadSuperDashboard();
        } else {
          loadDashboard();
        }
      }
    });

    // ─── Login / Register tabs ───

    function showLogin() {
      document.getElementById('tabLogin').classList.add('active');
      document.getElementById('tabRegister').classList.remove('active');
      document.getElementById('tabSuper').classList.remove('active');
      document.getElementById('loginPanel').style.display = 'block';
      document.getElementById('registerPanel').style.display = 'none';
      document.getElementById('superPanel').style.display = 'none';
      document.getElementById('loginError').textContent = '';
    }

    function showRegister() {
      document.getElementById('tabRegister').classList.add('active');
      document.getElementById('tabLogin').classList.remove('active');
      document.getElementById('tabSuper').classList.remove('active');
      document.getElementById('registerPanel').style.display = 'block';
      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('superPanel').style.display = 'none';
      document.getElementById('loginError').textContent = '';
    }

    function showSuperLogin() {
      document.getElementById('tabSuper').classList.add('active');
      document.getElementById('tabLogin').classList.remove('active');
      document.getElementById('tabRegister').classList.remove('active');
      document.getElementById('superPanel').style.display = 'block';
      document.getElementById('loginPanel').style.display = 'none';
      document.getElementById('registerPanel').style.display = 'none';
      document.getElementById('loginError').textContent = '';
    }

    // ─── Login ───

    async function doLogin() {
      const phone = document.getElementById('loginPhone').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const errorEl = document.getElementById('loginError');

      if (!phone || !password) { errorEl.textContent = '请输入手机号和密码'; return; }
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();

        if (res.ok) {
          token = data.token;
          localStorage.setItem('adminToken', token);
          localStorage.setItem('adminName', data.institution.name);
          loadDashboard();
        } else {
          errorEl.textContent = data.error || '登录失败';
        }
      } catch (e) {
        errorEl.textContent = '网络错误';
      }
    }

    function doLogout() {
      token = null;
      localStorage.removeItem('adminToken');
      localStorage.removeItem('adminName');
      localStorage.removeItem('isSuperAdmin');
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('superDashboard').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    }

    // ─── Super Admin Login ───

    async function doSuperLogin() {
      const username = document.getElementById('superUser').value.trim();
      const password = document.getElementById('superPassword').value.trim();
      const errorEl = document.getElementById('loginError');
      if (!username || !password) { errorEl.textContent = '请输入账号和密码'; return; }
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: username, password })
        });
        const data = await res.json();

        if (res.ok) {
          // Verify it's a super admin
          const checkRes = await fetch('/api/admin/super/dashboard', {
            headers: { 'Authorization': data.token }
          });
          if (!checkRes.ok) {
            errorEl.textContent = '该账号无超级管理员权限';
            return;
          }
          token = data.token;
          localStorage.setItem('adminToken', token);
          localStorage.setItem('isSuperAdmin', '1');
          loadSuperDashboard();
        } else {
          errorEl.textContent = data.error || '登录失败';
        }
      } catch (e) {
        errorEl.textContent = '网络错误';
      }
    }

    // ─── Register ───

    async function doRegister() {
      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value.trim();
      const errorEl = document.getElementById('loginError');

      if (!name) { errorEl.textContent = '请输入机构名称'; return; }
      if (!phone) { errorEl.textContent = '请输入手机号'; return; }
      if (password.length < 6) { errorEl.textContent = '密码至少6位'; return; }
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/admin/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, password })
        });
        const data = await res.json();

        if (res.ok) {
          token = data.token;
          localStorage.setItem('adminToken', token);
          localStorage.setItem('adminName', data.institution.name);
          showToast('✅ 注册成功！');
          loadDashboard();
        } else {
          errorEl.textContent = data.error || '注册失败';
        }
      } catch (e) {
        errorEl.textContent = '网络错误';
      }
    }

    // ─── Dashboard ───

    async function loadDashboard() {
      try {
        const res = await fetch('/api/admin/dashboard', {
          headers: { 'Authorization': token }
        });

        if (!res.ok) { doLogout(); return; }

        const data = await res.json();
        const name = localStorage.getItem('adminName') || '机构';
        document.getElementById('instName').textContent = name;
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        renderStats(data.stats);
        renderActivities(data.activities);
        renderFishList(data.fishList);
        renderLeads(data.leads);
      } catch (e) {
        showToast('加载失败');
      }
    }

    function renderStats(stats) {
      document.getElementById('statCards').innerHTML = `
        <div class="stat-card"><div class="num">${stats.participants}</div><div class="lbl">👶 参与人数</div></div>
        <div class="stat-card"><div class="num">${stats.total_fish}</div><div class="lbl">🐟 作品总数</div></div>
        <div class="stat-card"><div class="num">${stats.total_votes}</div><div class="lbl">⭐ 获得总赞</div></div>
        <div class="stat-card"><div class="num">${stats.leads}</div><div class="lbl">📱 家长留资</div></div>
      `;
    }

    function renderActivities(activities) {
      const tbody = document.getElementById('activityBody');
      if (!activities || activities.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text2);padding:20px">暂无活动</td></tr>';
        return;
      }
      tbody.innerHTML = activities.map(a => `
        <tr>
          <td>${escHtml(a.name)}</td>
          <td><span class="activity-code">${escHtml(a.code)}</span></td>
          <td>${a.fish_count}</td>
          <td>${a.total_votes}</td>
          <td>${a.created_at ? new Date(a.created_at).toLocaleDateString() : '-'}</td>
          <td><button class="copy-link-btn" onclick="copyActivityLink('${escHtml(a.code)}')">📋 复制链接</button></td>
        </tr>
      `).join('');
    }

    function renderFishList(list) {
      const tbody = document.getElementById('fishBody');
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text2);padding:20px">暂无作品</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(f => `
        <tr>
          <td>${escHtml(f.name)}</td>
          <td>${escHtml(f.child_name || '-')}</td>
          <td>${escHtml(f.age || '-')}</td>
          <td>⭐ ${f.votes}</td>
          <td class="${f.has_phone ? 'has-phone' : 'no-phone'}">${f.has_phone ? '✅ 已留资' : '—'}</td>
          <td>${f.created_at ? new Date(f.created_at).toLocaleDateString() : '-'}</td>
        </tr>
      `).join('');
    }

    function renderLeads(leads) {
      const tbody = document.getElementById('leadBody');
      if (!leads || leads.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text2);padding:20px">暂无留资</td></tr>';
        return;
      }
      tbody.innerHTML = leads.map(l => `
        <tr>
          <td>${escHtml(l.phone)}</td>
          <td>${escHtml(l.child_name)}</td>
          <td>${escHtml(l.age || '-')}</td>
          <td>${escHtml(l.fish_name)}</td>
          <td>${new Date(l.created_at).toLocaleDateString()}</td>
        </tr>
      `).join('');
    }

    // ─── Super Admin Dashboard ───

    let superAllFish = [];

    async function loadSuperDashboard() {
      try {
        const res = await fetch('/api/admin/super/dashboard', {
          headers: { 'Authorization': token }
        });
        if (!res.ok) { doLogout(); return; }
        const data = await res.json();
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('superDashboard').style.display = 'block';

        document.getElementById('superStatCards').innerHTML = `
          <div class="stat-card"><div class="num">${data.stats.total_institutions}</div><div class="lbl">🏫 机构</div></div>
          <div class="stat-card"><div class="num">${data.stats.total_fish}</div><div class="lbl">🐟 作品总数</div></div>
          <div class="stat-card"><div class="num">${data.stats.total_votes}</div><div class="lbl">⭐ 总赞</div></div>
          <div class="stat-card"><div class="num">${data.stats.total_leads}</div><div class="lbl">📱 总留资</div></div>
        `;

        // Institution table
        const instBody = document.getElementById('superInstBody');
        if (data.institutions.length === 0) {
          instBody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text2);padding:20px">暂无机构</td></tr>';
        } else {
          instBody.innerHTML = data.institutions.map(inst => `
            <tr>
              <td><strong>${escHtml(inst.name)}</strong></td>
              <td>${escHtml(inst.phone)}</td>
              <td>${inst.fish_count}</td>
              <td style="font-weight:600;color:var(--success)">${inst.lead_count}</td>
              <td>⭐ ${inst.total_votes}</td>
              <td>${inst.created_at ? new Date(inst.created_at).toLocaleDateString() : '-'}</td>
            </tr>
          `).join('');
        }

        // Lead table
        const leadBody = document.getElementById('superLeadBody');
        if (data.leads.length === 0) {
          leadBody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text2);padding:20px">暂无留资</td></tr>';
        } else {
          leadBody.innerHTML = data.leads.map(l => `
            <tr>
              <td style="font-weight:600">${escHtml(l.phone)}</td>
              <td>${escHtml(l.child_name)}</td>
              <td>${escHtml(l.age || '-')}</td>
              <td>${escHtml(l.fish_name)}</td>
              <td>${l.institution_name ? escHtml(l.institution_name) : '<span style="color:var(--text3)">未归属</span>'}</td>
              <td>${new Date(l.created_at).toLocaleDateString()}</td>
            </tr>
          `).join('');
        }

        // Load fish list
        loadSuperFish();
      } catch (e) {
        showToast('加载失败');
      }
    }

    // ─── Create activity ───

    async function createActivity() {
      const name = document.getElementById('newActivityName').value.trim();
      if (!name) { showToast('请输入活动名称'); return; }

      try {
        const res = await fetch('/api/admin/activity', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': token },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (data.success) {
          const link = window.location.origin + '/?activity=' + encodeURIComponent(data.code);
          showToast('✅ 活动已创建！活动链接已复制');
          document.getElementById('newActivityName').value = '';
          navigator.clipboard.writeText(link).catch(() => {});
          loadDashboard();
        } else {
          showToast(data.error || '创建失败');
        }
      } catch (e) {
        showToast('网络错误');
      }
    }

    // ─── Super Admin — Fish Management ───

    async function loadSuperFish() {
      try {
        const res = await fetch('/api/admin/super/fish', {
          headers: { 'Authorization': token }
        });
        if (!res.ok) return;
        const data = await res.json();
        superAllFish = data.fish;
        renderSuperFish();
      } catch (e) {}
    }

    function renderSuperFish() {
      const body = document.getElementById('superFishBody');
      const count = document.getElementById('superFishCount');
      document.getElementById('superFishAll').checked = false;
      if (!superAllFish || superAllFish.length === 0) {
        body.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text2);padding:30px">暂无作品</td></tr>';
        count.textContent = '共 0 条';
        return;
      }
      count.textContent = `共 ${superAllFish.length} 条`;
      body.innerHTML = superAllFish.map(f => {
        const safeName = escHtml(f.name);
        const safeChild = escHtml(f.child_name || '-');
        const safeAge = escHtml(f.age || '-');
        const safePhone = f.phone ? escHtml(f.phone) : '';
        return `<tr>
          <td><input type="checkbox" class="super-fish-cb" value="${f.id}" onchange="superUpdateSelectAll()"></td>
          <td><img class="fish-preview-img" src="${f.image_data}" alt=""></td>
          <td>${safeName}</td>
          <td>${safeChild}</td>
          <td>${safeAge}</td>
          <td>${safePhone || '<span style="color:var(--text3)">—</span>'}</td>
          <td>${f.institution_name ? escHtml(f.institution_name) : '<span style="color:var(--text3)">未归属</span>'}</td>
          <td>⭐ ${f.votes}</td>
          <td>${f.is_visible ? '✅ 显示' : '🚫 隐藏'}</td>
          <td>${new Date(f.created_at).toLocaleDateString()}</td>
        </tr>`;
      }).join('');
    }

    function superUpdateSelectAll() {
      const cbs = document.querySelectorAll('.super-fish-cb');
      const all = document.getElementById('superFishAll');
      const checked = document.querySelectorAll('.super-fish-cb:checked');
      all.checked = checked.length === cbs.length && cbs.length > 0;
    }

    function superToggleAllFish(checked) {
      document.querySelectorAll('.super-fish-cb').forEach(cb => cb.checked = checked);
    }

    function getSelectedFishIds() {
      return Array.from(document.querySelectorAll('.super-fish-cb:checked')).map(cb => cb.value);
    }

    function superDeleteFish() {
      const ids = getSelectedFishIds();
      if (ids.length === 0) { showToast('请先选择要删除的鱼'); return; }
      if (!confirm(`确定要删除选中的 ${ids.length} 条鱼吗？此操作不可恢复！`)) return;
      fetch('/api/admin/super/fish/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': token },
        body: JSON.stringify({ ids })
      }).then(r => r.json()).then(d => {
        if (d.success) {
          showToast(`✅ 已删除 ${d.deleted} 条鱼`);
          loadSuperFish();
          loadSuperDashboard();
        } else {
          showToast('删除失败');
        }
      }).catch(() => showToast('网络错误'));
    }

    function superEditFish() {
      const ids = getSelectedFishIds();
      if (ids.length === 0) { showToast('请先选择要编辑的鱼'); return; }
      if (ids.length > 1) { showToast('每次只能编辑一条鱼'); return; }
      const fish = superAllFish.find(f => f.id === ids[0]);
      if (!fish) return;

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999;display:flex;align-items:center;justify-content:center';
      overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

      const box = document.createElement('div');
      box.style.cssText = 'background:var(--bg);border-radius:16px;padding:28px;max-width:420px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.3)';
      box.innerHTML = `
        <h3 style="margin-bottom:16px">✏️ 编辑作品</h3>
        <div class="form-group"><label>鱼名</label><input type="text" id="editFishName" value="${escHtml(fish.name).replace(/"/g, '&quot;')}" class="edit-input"></div>
        <div class="form-group"><label>孩子昵称</label><input type="text" id="editChildName" value="${escHtml(fish.child_name || '').replace(/"/g, '&quot;')}" class="edit-input"></div>
        <div class="form-group"><label>年龄</label><input type="text" id="editAge" value="${escHtml(fish.age || '').replace(/"/g, '&quot;')}" class="edit-input"></div>
        <div class="form-group" style="margin:12px 0">
          <label><input type="checkbox" id="editVisible" ${fish.is_visible ? 'checked' : ''}> 显示在公共水族箱</label>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
          <button class="logout-btn" onclick="this.closest('[id=overlay]').remove()">取消</button>
          <button class="login-btn" id="editSaveBtn" onclick="superSaveFish('${fish.id}')">保存</button>
        </div>
      `;
      overlay.id = 'overlay';
      overlay.appendChild(box);
      document.body.appendChild(overlay);
    }

    async function superSaveFish(fishId) {
      const btn = document.getElementById('editSaveBtn');
      btn.disabled = true;
      btn.textContent = '保存中...';
      try {
        const res = await fetch(`/api/admin/super/fish/${fishId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': token },
          body: JSON.stringify({
            name: document.getElementById('editFishName').value.trim(),
            child_name: document.getElementById('editChildName').value.trim(),
            age: document.getElementById('editAge').value.trim(),
            is_visible: document.getElementById('editVisible').checked
          })
        });
        const d = await res.json();
        if (d.success) {
          showToast('✅ 已保存');
          const overlay = document.getElementById('overlay');
          if (overlay) overlay.remove();
          loadSuperFish();
          loadSuperDashboard();
        } else {
          showToast('保存失败');
        }
      } catch (e) {
        showToast('网络错误');
      }
      btn.disabled = false;
      btn.textContent = '保存';
    }

    // ─── Utils ───

    function copyActivityLink(code) {
      const url = window.location.origin + '/?activity=' + encodeURIComponent(code);
      navigator.clipboard.writeText(url).then(() => {
        showToast('✅ 活动链接已复制！');
      }).catch(() => {
        const input = document.createElement('input');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast('✅ 活动链接已复制！');
      });
    }

    function escHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
