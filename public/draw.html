<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大家一起来画鱼</title>
  <link rel="stylesheet" href="/styles.css?v=2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>">
</head>
<body>
  <div class="ocean-bg"></div>
  <div class="bubbles" id="bubbles"></div>

  <header>
    <div class="container header-inner">
      <a href="/" class="logo">🐟 大家一起来画鱼</a>
      <nav>
        <a href="/" class="nav-btn">水族箱</a>
        <a href="/draw.html" class="nav-btn primary active">✏️ 我也要画</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Institution Picker -->
    <div id="institutionPicker" class="inst-picker">
      <div class="inst-picker-inner">
        <h2>🎨 选择你的机构战队</h2>
        <p>选择你希望加入的机构战队，和他们一起画鱼！</p>
        <div id="instList" class="inst-list">
          <div class="loading"><div class="spinner"></div><div>加载机构列表...</div></div>
        </div>
      </div>
    </div>

    <!-- Drawing Canvas -->
    <div class="drawing-page" id="stepCanvas" style="display:none">
      <div class="drawing-canvas-wrap">
        <h2>🎨 画一条鱼</h2>
        <p style="color:var(--text2);font-size:14px;margin-bottom:12px">画一条鱼 🐟</p>
        <div id="instBanner" class="inst-banner" style="display:none">
          <span>🏫 正在为</span>
          <span class="inst-name" id="selectedInstName"></span>
          <span>战队创作</span>
          <button class="change-btn" onclick="showInstitutionPicker()">更换</button>
        </div>
        <div class="canvas-wrap">
          <canvas id="drawCanvas" width="800" height="400"></canvas>
        </div>
        <div id="fishIndicator" class="fish-indicator">✏️ 继续画...</div>
        <div class="tools">
          <div class="color-btn active" data-color="#333333" style="background:#333" onclick="DrawApp.setColor('#333333')"></div>
          <div class="color-btn" data-color="#e74c3c" style="background:#e74c3c" onclick="DrawApp.setColor('#e74c3c')"></div>
          <div class="color-btn" data-color="#e67e22" style="background:#e67e22" onclick="DrawApp.setColor('#e67e22')"></div>
          <div class="color-btn" data-color="#f1c40f" style="background:#f1c40f" onclick="DrawApp.setColor('#f1c40f')"></div>
          <div class="color-btn" data-color="#2ecc71" style="background:#2ecc71" onclick="DrawApp.setColor('#2ecc71')"></div>
          <div class="color-btn" data-color="#3498db" style="background:#3498db" onclick="DrawApp.setColor('#3498db')"></div>
          <div class="color-btn" data-color="#9b59b6" style="background:#9b59b6" onclick="DrawApp.setColor('#9b59b6')"></div>
          <div class="color-btn" data-color="#1abc9c" style="background:#1abc9c" onclick="DrawApp.setColor('#1abc9c')"></div>
          <div class="separator" style="width:1px;height:24px;background:rgba(0,0,0,0.08);margin:0 6px"></div>
          <button class="tool-btn" onclick="DrawApp.undo()">↩ 撤销</button>
          <button class="tool-btn" id="eraserBtn" onclick="DrawApp.toggleEraser()">🧹 橡皮</button>
          <button class="tool-btn" onclick="DrawApp.clearCanvas()">🗑️ 清空</button>
          <div class="size-slider">
            <span style="font-size:12px;color:var(--text2)">粗细</span>
            <div class="size-dots">
              <div class="size-dot active" data-size="3" style="width:8px;height:8px" onclick="selectSize(this,3)"></div>
              <div class="size-dot" data-size="6" style="width:12px;height:12px" onclick="selectSize(this,6)"></div>
              <div class="size-dot" data-size="9" style="width:16px;height:16px" onclick="selectSize(this,9)"></div>
              <div class="size-dot" data-size="14" style="width:20px;height:20px" onclick="selectSize(this,14)"></div>
              <div class="size-dot" data-size="20" style="width:24px;height:24px" onclick="selectSize(this,20)"></div>
            </div>
          </div>
          <button class="landscape-btn" onclick="toggleLandscape()">🔄 横屏画</button>
        </div>
        <button class="landscape-exit-btn" id="landscapeExitBtn" onclick="toggleLandscape()">✕ 退出横屏</button>
      </div>
      <div class="sidebar">
        <h3>✨ 发布你的鱼</h3>
        <div class="form-group">
          <label>孩子昵称</label>
          <input type="text" id="childName" placeholder="如：王小美" maxlength="20">
        </div>
        <div class="form-group">
          <label>年龄（可选）</label>
          <input type="text" id="childAge" placeholder="如：6岁" maxlength="10">
        </div>
        <div style="text-align:center;margin:16px 0">
          <canvas id="previewCanvas" width="200" height="100" style="width:100%;max-width:300px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#fff"></canvas>
          <div style="font-size:12px;color:var(--text2);margin-top:4px">实时预览</div>
        </div>
        <button class="submit-btn" id="submitBtn" onclick="submitFish()" disabled>🌊 放归大海</button>
        <p style="font-size:12px;color:var(--text3);text-align:center;margin-top:6px" id="submitHint">画一条能被识别的鱼才能发布</p>
        <div class="tips">
          <strong>🎯 小贴士：</strong><br>
          • 尽量画完整的鱼身<br>
          • 可以加鱼鳍、鱼鳞、泡泡<br>
          • 创意无限，什么鱼都可以！
        </div>
      </div>
    </div>

    <!-- AI Comment -->
    <div id="stepComment" style="display:none">
      <div class="comment-section" id="commentSection">
        <h3>🎨 小艺术家点评</h3>
        <div class="subtitle" id="commentChildName"></div>
        <div class="comment-text" id="commentText"></div>
        <div class="radar" id="radarContainer"></div>
        <div class="phone-section">
          <p>📱 AI时代，培养孩子的审美和品味尤为重要，<br>一键预约线上免费审美测评</p>
          <div class="phone-input-group">
            <input type="tel" id="phoneInput" placeholder="手机号" maxlength="11">
            <button onclick="savePhone()">预约测评</button>
          </div>
          <p style="font-size:12px;color:var(--text3);margin-top:6px">👆 老师会加微信，沟通测评时间</p>
        </div>
        <a href="/" class="go-to-tank-btn">🌊 去水族箱看看</a>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script src="/js/draw.js"></script>
  <script>
    // ─── State ───
    const urlParams = new URLSearchParams(window.location.search);
    const activityCode = urlParams.get('activity');
    let publishedFishId = null;
    let activityInfo = null;
    let selectedInstitutionId = null;
    let selectedInstitutionName = '';
    let isLandscape = false;

    // ─── Activity ───
    if (activityCode) {
      fetch(`/api/activity/${activityCode}`).then(r => r.json()).then(d => {
        activityInfo = d;
        selectedInstitutionId = d.institution_id;
        selectedInstitutionName = d.institution_name || d.name;
        document.getElementById('instBanner').style.display = 'flex';
        document.getElementById('selectedInstName').textContent = selectedInstitutionName;
        document.getElementById('stepCanvas').style.display = 'flex';
        DrawApp.init('drawCanvas');
      }).catch(() => {});
    }

    function getActivityParams() {
      const p = {};
      if (activityInfo) { p.institution_id = activityInfo.institution_id; p.activity_id = activityInfo.id; }
      else if (selectedInstitutionId) { p.institution_id = selectedInstitutionId; }
      return p;
    }

    function showInstitutionPicker() {
      document.getElementById('institutionPicker').style.display = 'flex';
      document.getElementById('stepCanvas').style.display = 'none';
      document.getElementById('stepComment').style.display = 'none';
      const listEl = document.getElementById('instList');
      if (listEl.querySelector('.loading')) loadInstitutions();
    }

    function selectInstitution(id, name) {
      selectedInstitutionId = id;
      selectedInstitutionName = name;
      document.getElementById('institutionPicker').style.display = 'none';
      document.getElementById('stepCanvas').style.display = 'flex';
      document.getElementById('instBanner').style.display = 'flex';
      document.getElementById('selectedInstName').textContent = name;
      DrawApp.init('drawCanvas');
      window.scrollTo(0, 0);
    }

    // ─── Init ───
    window.addEventListener('load', () => {
      if (!activityCode) {
        loadInstitutions();
      }
      setInterval(() => {
        const preview = document.getElementById('previewCanvas');
        const mc = DrawApp.canvas;
        if (mc && preview) {
          const pCtx = preview.getContext('2d');
          pCtx.clearRect(0, 0, preview.width, preview.height);
          try { pCtx.drawImage(mc, 0, 0, preview.width, preview.height); } catch(e) {}
        }
      }, 500);
    });

    async function loadInstitutions() {
      document.getElementById('institutionPicker').style.display = 'flex';
      const listEl = document.getElementById('instList');
      try {
        const res = await fetch('/api/institutions');
        const list = await res.json();
        if (list.length === 0) {
          listEl.innerHTML = '<div style="padding:20px;color:var(--text2)">暂无可选机构，请先联系管理员注册</div>';
          return;
        }
        listEl.innerHTML = list.map(inst =>
          `<button class="inst-option" onclick="selectInstitution('${inst.id}', '${escHtml(inst.name)}')">
            <span class="icon">🏫</span>
            <span class="info"><span class="name">${escHtml(inst.name)}</span></span>
          </button>`
        ).join('');
      } catch (e) {
        listEl.innerHTML = '<div style="padding:20px;color:var(--text2)">加载失败，<a href="#" onclick="location.reload()">重试</a></div>';
      }
    }

    // ─── Submit ───
    async function submitFish() {
      const childName = document.getElementById('childName').value.trim();
      const age = document.getElementById('childAge').value.trim();
      if (!childName) { showToast('请输入孩子昵称'); return; }
      if (DrawApp.fishConfidence < 60) { showToast('画一条能被识别的鱼！'); return; }
      let imageData = DrawApp.getImageData();
      const empty = await isCanvasEmpty(imageData);
      if (empty) { showToast('先画一条鱼吧！'); return; }
      imageData = await trimImage(imageData);
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '🐟 正在放归大海...';
      await doPublish(imageData, childName, age);
    }

    async function doPublish(imageData, childName, age) {
      childName = childName || document.getElementById('childName').value.trim();
      age = age || document.getElementById('childAge').value.trim();
      const instName = activityInfo ? activityInfo.institution_name || activityInfo.name : '';
      const fishName = instName ? instName + '_' + childName + '的鱼' : (childName || '小画家') + '的鱼';
      const actParams = getActivityParams();
      try {
        const res = await fetch('/api/fish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: fishName, author: childName, child_name: childName,
            age: age, image_data: imageData,
            institution_id: actParams.institution_id || null,
            activity_id: actParams.activity_id || null,
            device_id: getDeviceId()
          })
        });
        const data = await res.json();
        if (data.success) {
          publishedFishId = data.id;
          localStorage.setItem('myFishId', data.id);
          showAIComment(childName, age);
        } else {
          showToast(data.error || '发布失败');
          document.getElementById('submitBtn').disabled = false;
          document.getElementById('submitBtn').textContent = '🌊 放归大海';
        }
      } catch (e) {
        showToast('网络错误，请重试');
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('submitBtn').textContent = '🌊 放归大海';
      }
    }

    // ─── AI Comment ───

    function showAIComment(childName, age) {
      document.getElementById('stepCanvas').style.display = 'none';
      document.getElementById('stepComment').style.display = 'block';
      const section = document.getElementById('commentSection');
      section.style.display = 'block';
      const greeting = age ? childName + '（' + age + '）' : childName;
      document.getElementById('commentChildName').textContent = greeting + '，来看看你的评语：';
      const comment = generateComment();
      document.getElementById('commentText').textContent = comment.text;
      const radar = document.getElementById('radarContainer');
      const colors = ['#e74c3c', '#2ecc71', '#3498db', '#f39c12'];
      const labels = ['色彩感知', '造型能力', '创意表达', '细节观察'];
      radar.innerHTML = comment.scores.map((s, i) =>
        '<div class="radar-item"><span class="label">' + labels[i] + '</span>' +
        '<div class="bar"><div class="bar-fill" style="width:' + s + '%;background:' + colors[i] + '"></div></div>' +
        '<span class="pct">' + s + '%</span></div>'
      ).join('');
    }

    function generateComment() {
      // Analyze actual drawing on canvas
      const canvas = DrawApp.canvas;
      let colorCount = 0, totalPx = 0, colorSet = new Set();
      if (canvas) {
        const ctx = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        // Sample at stride to keep it fast
        const step = 4;
        const data = ctx.getImageData(0, 0, w, h).data;
        for (let y = 0; y < h; y += step) {
          for (let x = 0; x < w; x += step) {
            const i = (y * w + x) * 4;
            if (data[i+3] > 128) {
              totalPx++;
              const r = data[i], g = data[i+1], b = data[i+2];
              // Merge dark/near-black pixels to avoid anti-alias artifacts
              if (r < 60 && g < 60 && b < 60) {
                colorSet.add('k');
              } else {
                // Coarse quantization to merge similar colors
                const q = 80;
                colorSet.add(`${Math.round(r/q)*q},${Math.round(g/q)*q},${Math.round(b/q)*q}`);
              }
            }
          }
        }
        colorCount = colorSet.size;
      }

      const isDetailed = totalPx > 3000;
      const isSimple = totalPx < 800;
      const isColorful = colorCount >= 4;
      const isMono = colorCount <= 1;

      // Build comment from actual observations
      let parts = [];

      if (isSimple) parts.push('画风简洁有力，鱼的基本轮廓很清晰');
      else if (isDetailed) parts.push('画得很用心，画面内容很丰富');
      else parts.push('鱼的形态抓得不错，造型完整');

      parts.push('继续加油，越画越好！');

      const text = parts.join('。') + '🎉';

      // Generate realistic scores based on actual drawing
      const baseShape = Math.min(90, 50 + totalPx * 0.02);
      const baseColor = isColorful ? 75 : isMono ? 50 : 65;
      const baseCreative = isDetailed ? 75 : isSimple ? 60 : 65;
      const baseDetail = isDetailed ? 80 : isSimple ? 40 : 55;

      const jitter = () => Math.floor(Math.random() * 10) - 5;
      const scores = [
        Math.max(10, Math.min(100, Math.round(baseColor + jitter()))),
        Math.max(10, Math.min(100, Math.round(baseShape + jitter()))),
        Math.max(10, Math.min(100, Math.round(baseCreative + jitter()))),
        Math.max(10, Math.min(100, Math.round(baseDetail + jitter()))),
      ];

      return { text, scores };
    }

    // ─── Phone ───
    async function savePhone() {
      const phone = document.getElementById('phoneInput').value.trim();
      if (!phone || phone.length < 11) { showToast('请输入正确的手机号'); return; }
      try {
        await fetch('/api/fish/' + publishedFishId + '/phone', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone })
        });
        showToast('✅ 已保存，老师会尽快联系您');
        document.getElementById('phoneInput').value = '';
      } catch (e) { showToast('保存成功！'); }
    }

    // ─── Image utilities ───
    function trimImage(dataUrl) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          const src = document.createElement('canvas');
          src.width = img.width; src.height = img.height;
          const sCtx = src.getContext('2d');
          sCtx.drawImage(img, 0, 0);
          const px = sCtx.getImageData(0, 0, src.width, src.height).data;
          const T = 245;
          let minX = src.width, minY = src.height, maxX = 0, maxY = 0;
          for (let y = 0; y < src.height; y++) {
            for (let x = 0; x < src.width; x++) {
              const i = (y * src.width + x) * 4;
              if (px[i+3] > 0 && (px[i] < T || px[i+1] < T || px[i+2] < T)) {
                if (x < minX) minX = x; if (x > maxX) maxX = x;
                if (y < minY) minY = y; if (y > maxY) maxY = y;
              }
            }
          }
          if (maxX < minX || maxY < minY) { resolve(dataUrl); return; }
          const pad = 6;
          minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
          maxX = Math.min(src.width - 1, maxX + pad); maxY = Math.min(src.height - 1, maxY + pad);
          const w = maxX - minX + 1, h = maxY - minY + 1;
          const out = document.createElement('canvas');
          out.width = w; out.height = h;
          const oCtx = out.getContext('2d');
          const outData = oCtx.createImageData(w, h);
          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const si = ((minY + y) * src.width + (minX + x)) * 4;
              const di = (y * w + x) * 4;
              if (px[si] > T && px[si+1] > T && px[si+2] > T) {
                outData.data[di] = 0; outData.data[di+1] = 0; outData.data[di+2] = 0; outData.data[di+3] = 0;
              } else {
                outData.data[di] = px[si]; outData.data[di+1] = px[si+1]; outData.data[di+2] = px[si+2]; outData.data[di+3] = px[si+3];
              }
            }
          }
          oCtx.putImageData(outData, 0, 0);
          resolve(out.toDataURL('image/png'));
        };
        img.src = dataUrl;
      });
    }

    function isCanvasEmpty(dataUrl) {
      return new Promise(resolve => {
        const img = new Image();
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        img.onload = () => {
          canvas.width = img.width; canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
          for (let i = 0; i < data.length; i += 4) {
            if (data[i+3] > 0 && (data[i] < 240 || data[i+1] < 240 || data[i+2] < 240)) return resolve(false);
          }
          resolve(true);
        };
        img.src = dataUrl;
      });
    }

    // ─── Utilities ───
    function getDeviceId() {
      let id = localStorage.getItem('deviceId');
      if (!id) { id = 'dev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('deviceId', id); }
      return id;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function escHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    function selectSize(el, size) {
      DrawApp.setBrushSize(size);
      document.querySelectorAll('.size-dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    // ─── Landscape mode ───
    function toggleLandscape() {
      isLandscape = !isLandscape;
      DrawApp.isLandscape = isLandscape;
      const page = document.getElementById('stepCanvas');
      const exitBtn = document.getElementById('landscapeExitBtn');
      if (isLandscape) {
        page.classList.add('landscape-mode');
        exitBtn.style.display = 'block';
        DrawApp.saveState();
        setTimeout(() => { DrawApp.setupCanvas(); DrawApp.restoreRotated(90); }, 100);
      } else {
        page.classList.remove('landscape-mode');
        exitBtn.style.display = 'none';
        DrawApp.saveState();
        setTimeout(() => { DrawApp.setupCanvas(); DrawApp.restoreRotated(-90); }, 100);
      }
    }

    window.addEventListener('orientationchange', () => {
      if (screen.orientation && screen.orientation.type.startsWith('landscape')) {
        if (!isLandscape) toggleLandscape();
      } else {
        if (isLandscape) toggleLandscape();
      }
    });

    // ─── Bubbles ───
    (function() {
      const c = document.getElementById('bubbles');
      for (let i = 0; i < 20; i++) {
        const b = document.createElement('div'); b.className = 'bubble';
        const s = 4 + Math.random() * 16;
        b.style.width = s + 'px'; b.style.height = s + 'px';
        b.style.left = Math.random() * 100 + '%';
        b.style.animationDuration = 15 + Math.random() * 30 + 's';
        b.style.animationDelay = Math.random() * 20 + 's';
        c.appendChild(b);
      }
    })();
  </script>
</body>
</html>
