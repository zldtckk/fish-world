<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>大家一起来画鱼</title>
  <link rel="stylesheet" href="/styles.css?v=2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
</head>
<body>
  <div class="ocean-bg"></div>
  <div class="bubbles" id="bubbles"></div>

  <header>
    <div class="container header-inner">
      <a href="/" class="logo">🐟 大家一起来画鱼</a>
      <nav>
        <a href="/" class="nav-btn active">水族箱</a>
        <a href="/draw.html" class="nav-btn primary">✏️ 我也要画</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="activity-hero" id="activityHero">
      <div class="inst-name" id="instName" style="display:none"></div>
      <h1 id="activityName">🌊 全球水族箱</h1>
      <div class="stats-bar">
        <div class="item"><div class="num" id="statFish">0</div><div class="lbl">🐟 作品</div></div>
        <div class="item"><div class="num" id="statVotes">0</div><div class="lbl">⭐ 总赞</div></div>
        <div class="item"><div class="num" id="statPeople">0</div><div class="lbl">👶 小画家</div></div>
      </div>
      <div class="draw-btn-wrap">
        <a href="/draw.html" class="draw-btn">✏️ 我也要画</a>
      </div>
    </section>

    <section class="aquarium-section">
      <div class="section-header">
        <h2>🌊 水族箱</h2>
        <span style="font-size:13px;color:var(--text2);cursor:pointer" onclick="location.reload()">🔄 刷新</span>
      </div>
      <div class="aquarium-hint">
        <span class="feed-hint">💡 点击鱼查看详情 · 双击撒饲料 · 自己的鱼有 ✨ 高亮</span>
        <span class="fish-count-slider">
          <span style="color:var(--text2);font-size:12px">🐟</span>
          <input type="range" id="fishLimitSlider" min="20" max="200" value="50" step="10">
          <span id="fishLimitLabel" style="font-size:12px;color:var(--text2);min-width:32px;display:inline-block">50</span>
        </span>
        <button class="feed-btn" onclick="Aquarium.feedCenter()">🫘 喂食</button>
        <button class="feed-btn" onclick="toggleFullscreen()">⛶ 全屏</button>
      </div>
      <div class="aquarium-stage" id="aquariumStage">
        <div class="sea-floor"></div>
        <div class="light-ray" style="left:15%"></div>
        <div class="light-ray" style="left:40%;animation-delay:2s"></div>
        <div class="light-ray" style="left:65%;animation-delay:4s"></div>
        <div class="loading" id="aquariumLoading">
          <div class="spinner"></div>
          <div>鱼群正在游来...</div>
        </div>
      </div>
      <button class="fullscreen-exit-btn" id="fullscreenExitBtn" onclick="toggleFullscreen()">✕ 退出全屏</button>
    </section>

    <section>
      <div class="section-tabs">
        <button class="active" data-rank="personal">🏆 个人榜</button>
        <button data-rank="institution">🏫 机构榜</button>
      </div>
      <div id="rankContent">
        <div class="loading"><div class="spinner"></div><div>加载中...</div></div>
      </div>
    </section>
  </main>

  <!-- Fish Detail Modal -->
  <div class="modal-overlay" id="fishModal">
    <div class="modal">
      <button class="modal-close" onclick="closeFishModal()">✕</button>
      <div class="modal-detail-name" id="modalFishName"></div>
      <div class="modal-detail-sub" id="modalFishSub"></div>
      <img class="modal-fish-img" id="modalFishImg" src="" alt="">
      <div class="modal-vote-area" id="modalVoteArea">
        <button class="modal-vote-btn" id="modalVoteBtn" onclick="voteFish()">👍 点赞</button>
        <div class="modal-voted-msg" id="modalVotedMsg" style="display:none">✅ 已点赞</div>
      </div>
      <div style="text-align:center;font-size:13px;color:var(--text2);margin-top:4px">
        ⭐ <span id="modalVotes">0</span> 赞
      </div>
    </div>
  </div>

  <!-- Share Modal -->
  <div class="modal-overlay" id="shareModal">
    <div class="modal">
      <button class="modal-close" onclick="document.getElementById('shareModal').classList.remove('open')">✕</button>
      <div class="share-modal">
        <h3 style="text-align:center;font-size:18px">📤 分享给好友</h3>
        <p>让朋友来给你的鱼点赞！</p>
        <div class="share-link-box" id="shareLink">https://...</div>
        <button class="share-btn-copy" onclick="copyShareLink()">📋 复制链接</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/aquarium.js?v=2"></script>
  <script>
    // ─── State ───
    const params = new URLSearchParams(window.location.search);
    const activityCode = params.get('activity');
    let activityInfo = null;
    let myFishId = localStorage.getItem('myFishId');
    let votedToday = {};
    let currentFishId = null;

    // ─── Init ───
    window.addEventListener('load', async () => {
      createBubbles();
      createSeaweed();
      await loadActivity();
      loadStats();
      loadRank('personal');
      initAquarium();
    });

    // ─── Activity ───
    async function loadActivity() {
      if (!activityCode) return;
      try {
        const res = await fetch(`/api/activity/${activityCode}`);
        activityInfo = await res.json();
        document.getElementById('instName').textContent = '🏫 ' + activityInfo.institution_name;
        document.getElementById('instName').style.display = 'block';
        document.getElementById('activityName').textContent = '🌊 ' + activityInfo.name;
        document.querySelectorAll('a[href="/draw.html"]').forEach(a => {
          a.href = '/draw.html?activity=' + encodeURIComponent(activityCode);
        });
      } catch (e) {}
    }

    // ─── Stats ───
    async function loadStats() {
      try {
        const actId = activityInfo?.id || activityCode;
        const url = actId ? `/api/stats?activity=${encodeURIComponent(actId)}` : '/api/stats';
        const res = await fetch(url);
        const s = await res.json();
        document.getElementById('statFish').textContent = s.totalFish;
        document.getElementById('statVotes').textContent = s.totalVotes;
      } catch (e) {}
    }

    // ─── Rankings ───
    async function loadRank(type) {
      const container = document.getElementById('rankContent');
      container.innerHTML = '<div class="loading"><div class="spinner"></div><div>加载中...</div></div>';
      try {
        if (type === 'personal') {
          const actId = activityInfo?.id || activityCode;
          const url = actId ? `/api/rank/individual?activity=${encodeURIComponent(actId)}` : '/api/rank/individual';
          const res = await fetch(url);
          const data = await res.json();
          renderPersonalRank(container, data.list);
        } else {
          const res = await fetch('/api/rank/institution');
          const data = await res.json();
          renderInstitutionRank(container, data.list);
        }
      } catch (e) {
        container.innerHTML = '<div class="empty-state"><p>加载失败</p></div>';
      }
    }

    function renderPersonalRank(container, list) {
      if (!list || list.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="big-icon">🐟</div><h3>还没有鱼</h3><p>快来画第一条鱼吧！</p></div>';
        return;
      }
      let html = '<div class="rank-list">';
      if (myFishId) {
        const mine = list.find(f => f.id === myFishId);
        if (mine) {
          html += '<div class="my-fish-highlight"><div class="fish-icon">🐟</div><div class="info"><div class="name">✨ ' + escHtml(mine.name) + '</div><div class="votes">⭐ ' + mine.votes + ' 赞 · 排名 #' + mine.rank + '</div></div><button class="share-btn" onclick="openShareModal(\'' + mine.id + '\')">📤 分享</button></div>';
        }
      }
      list.forEach(f => {
        const medal = f.rank === 1 ? '🥇' : f.rank === 2 ? '🥈' : f.rank === 3 ? '🥉' : '';
        const cls = f.rank === 1 ? 'gold' : f.rank === 2 ? 'silver' : f.rank === 3 ? 'bronze' : '';
        html += '<div class="rank-item" onclick="openFishModal(\'' + f.id + '\')"><div class="rank-num ' + cls + '">' + (medal || f.rank) + '</div><div class="rank-info"><div class="name">' + escHtml(f.name) + '</div><div class="sub">' + escHtml(f.child_name || f.author) + (f.institution_name ? ' · ' + escHtml(f.institution_name) : '') + '</div></div><div class="rank-votes">' + f.votes + ' <small>赞</small></div></div>';
      });
      html += '</div>';
      container.innerHTML = html;
    }

    function renderInstitutionRank(container, list) {
      if (!list || list.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="big-icon">🏫</div><h3>还没有机构</h3></div>';
        return;
      }
      let html = '<div class="rank-list">';
      list.forEach(inst => {
        const medal = inst.rank === 1 ? '🥇' : inst.rank === 2 ? '🥈' : inst.rank === 3 ? '🥉' : '';
        const cls = inst.rank === 1 ? 'gold' : inst.rank === 2 ? 'silver' : inst.rank === 3 ? 'bronze' : '';
        html += '<div class="rank-item"><div class="rank-num ' + cls + '">' + (medal || inst.rank) + '</div><div class="rank-info"><div class="name">' + escHtml(inst.name) + '</div><div class="sub">👶 ' + (inst.participant_count || inst.fish_count) + ' 位小画家</div></div><div class="rank-votes">' + inst.total_votes + ' <small>赞</small></div></div>';
      });
      html += '</div>';
      container.innerHTML = html;
    }

    document.querySelectorAll('.section-tabs button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.section-tabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadRank(btn.dataset.rank);
      });
    });

    // ─── Fish Modal ───
    async function openFishModal(id) {
      currentFishId = id;
      const modal = document.getElementById('fishModal');
      modal.classList.add('open');
      try {
        const res = await fetch(`/api/fish/${id}`);
        const fish = await res.json();
        document.getElementById('modalFishName').textContent = fish.name;
        document.getElementById('modalFishSub').textContent = 'by ' + (fish.child_name || fish.author) + (fish.institution_name ? ' · ' + fish.institution_name : '');
        document.getElementById('modalFishImg').src = fish.image_data;
        document.getElementById('modalVotes').textContent = (fish.upvotes || 0) - (fish.downvotes || 0);
        const today = new Date().toISOString().slice(0, 10);
        const alreadyVoted = votedToday[id + '_' + today] || localStorage.getItem('voted_' + id + '_' + today);
        document.getElementById('modalVoteBtn').style.display = alreadyVoted ? 'none' : 'inline-block';
        document.getElementById('modalVotedMsg').style.display = alreadyVoted ? 'block' : 'none';
        document.getElementById('modalVoteBtn').disabled = false;
      } catch (e) { showToast('加载失败'); }
    }

    function closeFishModal() { document.getElementById('fishModal').classList.remove('open'); currentFishId = null; }

    async function voteFish() {
      if (!currentFishId) return;
      const btn = document.getElementById('modalVoteBtn');
      btn.disabled = true; btn.textContent = '⏳ ...';
      try {
        const res = await fetch(`/api/fish/${currentFishId}/vote`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_id: getDeviceId() })
        });
        const data = await res.json();
        if (data.success) {
          const today = new Date().toISOString().slice(0, 10);
          votedToday[currentFishId + '_' + today] = true;
          localStorage.setItem('voted_' + currentFishId + '_' + today, '1');
          document.getElementById('modalVoteBtn').style.display = 'none';
          document.getElementById('modalVotedMsg').style.display = 'block';
          document.getElementById('modalVotes').textContent = data.votes;
          loadStats();
          const activeTab = document.querySelector('.section-tabs button.active');
          if (activeTab) loadRank(activeTab.dataset.rank || 'personal');
          showToast('👍 点赞成功！');
        } else if (data.alreadyVoted) {
          showToast('今天已经点过赞了！');
          document.getElementById('modalVoteBtn').style.display = 'none';
          document.getElementById('modalVotedMsg').style.display = 'block';
        } else { showToast(data.error || '点赞失败'); btn.disabled = false; btn.textContent = '👍 点赞'; }
      } catch (e) { showToast('网络错误'); btn.disabled = false; btn.textContent = '👍 点赞'; }
    }

    function openShareModal(fishId) {
      document.getElementById('shareLink').textContent = window.location.origin + '/?fish=' + fishId;
      document.getElementById('shareModal').classList.add('open');
    }

    async function copyShareLink() {
      const text = document.getElementById('shareLink').textContent;
      try { await navigator.clipboard.writeText(text); showToast('✅ 链接已复制！'); }
      catch { const inp = document.createElement('input'); inp.value = text; document.body.appendChild(inp); inp.select(); document.execCommand('copy'); document.body.removeChild(inp); showToast('✅ 链接已复制！'); }
    }

    // ─── Fullscreen ───
    function swapFishCoords() {
      for (const [fishId, obj] of Aquarium.fishObjects) {
        const { state } = obj;
        const tmp = state.x;
        state.x = state.y;
        state.y = tmp;
        state.targetY = state.y;
      }
    }

    function toggleFullscreen() {
      const stage = document.getElementById('aquariumStage');
      // Mobile (including WeChat): just toggle the class, no Fullscreen API
      if (window.innerWidth <= 768) {
        if (!stage.classList.contains('-fullscreen')) {
          swapFishCoords();
          stage.classList.add('-fullscreen');
        } else {
          stage.classList.remove('-fullscreen');
          swapFishCoords();
        }
        return;
      }
      // Desktop: use Fullscreen API
      if (!document.fullscreenElement) {
        stage.classList.add('-fullscreen');
        if (stage.requestFullscreen) stage.requestFullscreen();
        else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    document.addEventListener('fullscreenchange', onFsChange);
    document.addEventListener('webkitfullscreenchange', onFsChange);

    function onFsChange() {
      // Desktop only: remove class when exiting fullscreen via ESC
      if (window.innerWidth <= 768) return;
      const stage = document.getElementById('aquariumStage');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        stage.classList.remove('-fullscreen');
      }
    }

    // ─── Aquarium ───
    let _fishLimit = 50;

    async function loadFish(limit) {
      _fishLimit = limit || _fishLimit;
      const loading = document.getElementById('aquariumLoading');
      loading.style.display = '';
      loading.innerHTML = '<div class="spinner"></div><div>鱼群正在游来...</div>';
      try {
        const res = await fetch(`/api/fish?sort=random&limit=${_fishLimit}`);
        const data = await res.json();
        if (data.fish.length === 0) {
          loading.innerHTML = '<div style="margin-top:60px">🐟 <br>水族箱还是空的<br><small style="color:var(--text2)">去画一条鱼吧！</small></div>';
          return;
        }
        loading.style.display = 'none';
        await Aquarium.loadFishIntoAquarium(data.fish);
        highlightMyFish();
      } catch (e) { loading.innerHTML = '<div>加载失败，<a href="#" onclick="location.reload()">点击刷新</a></div>'; }
    }

    async function initAquarium() {
      const loading = document.getElementById('aquariumLoading');
      const failTimer = setTimeout(() => { loading.innerHTML = '<div>⏳ 加载超时，<a href="#" onclick="location.reload()">点击刷新</a></div>'; }, 15000);
      try {
        await loadFish(50);
        clearTimeout(failTimer);
      } catch (e) { clearTimeout(failTimer); loading.innerHTML = '<div>加载失败，<a href="#" onclick="location.reload()">点击刷新</a></div>'; }
    }

    document.getElementById('fishLimitSlider').addEventListener('input', function() {
      document.getElementById('fishLimitLabel').textContent = this.value;
    });

    let _reloadTimer = null;
    document.getElementById('fishLimitSlider').addEventListener('change', function() {
      clearTimeout(_reloadTimer);
      _reloadTimer = setTimeout(() => {
        Aquarium.clear();
        loadFish(parseInt(this.value));
      }, 300);
    });

    function highlightMyFish() {
      if (!myFishId) return;
      setTimeout(() => {
        const el = document.querySelector(`.aquarium-fish[data-fish-id="${myFishId}"]`);
        if (el) {
          el.style.filter = 'brightness(1.2) drop-shadow(0 0 12px rgba(74,184,232,0.8))';
          el.style.zIndex = '50';
          const sp = document.createElement('div');
          sp.style.cssText = 'position:absolute;top:-8px;right:-8px;font-size:16px;pointer-events:none;animation:sparkle 1.5s ease-in-out infinite';
          sp.textContent = '✨';
          el.appendChild(sp);
        }
      }, 1000);
    }

    Aquarium.init(document.getElementById('aquariumStage'));
    document.getElementById('aquariumStage').addEventListener('dblclick', (e) => { Aquarium.handleFeed(e); });

    // ─── Utilities ───
    function getDeviceId() {
      let id = localStorage.getItem('deviceId');
      if (!id) { id = 'dev_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('deviceId', id); }
      return id;
    }

    function escHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    document.getElementById('fishModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeFishModal(); });
    document.getElementById('shareModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeFishModal(); document.getElementById('shareModal').classList.remove('open'); } });

    // ─── Background effects ───
    function createBubbles() {
      const c = document.getElementById('bubbles');
      for (let i = 0; i < 25; i++) {
        const b = document.createElement('div'); b.className = 'bubble';
        const s = 4 + Math.random() * 20;
        b.style.width = s + 'px'; b.style.height = s + 'px';
        b.style.left = Math.random() * 100 + '%';
        b.style.animationDuration = 15 + Math.random() * 30 + 's';
        b.style.animationDelay = Math.random() * 20 + 's';
        c.appendChild(b);
      }
    }

    function createSeaweed() {
      const stage = document.getElementById('aquariumStage');
      for (let i = 0; i < 8; i++) {
        const w = document.createElement('div'); w.className = 'seaweed';
        w.style.left = (5 + Math.random() * 90) + '%';
        w.style.height = (30 + Math.random() * 60) + 'px';
        w.style.animationDelay = (Math.random() * 4) + 's';
        w.style.animationDuration = (3 + Math.random() * 3) + 's';
        stage.appendChild(w);
      }
    }

    // Sparkle style
    document.head.appendChild(Object.assign(document.createElement('style'), { textContent: '@keyframes sparkle { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.3)} }' }));
  </script>
</body>
</html>
